# Cloudflare Workers CI/CD Workflow
# Prevents Error #6 (secrets syntax), #8 (context syntax)
#
# Triggers on: push to main (deploy), pull requests (test only)
# Requires: CLOUDFLARE_API_TOKEN secret
# Deploys to: Cloudflare Workers

name: Cloudflare Workers CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: deployment uses the CLOUDFLARE_API_TOKEN secret, not
# repository write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build worker
        run: npm run build

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build worker
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Worker URL: https://your-worker.your-subdomain.workers.dev"
