# Dependency Review Workflow
# Prevents Error #16 (devDependencies ignored)
#
# Triggers on: pull_request
# Reviews: All dependency changes for security vulnerabilities
# Blocks: PRs with high/critical vulnerabilities

name: Dependency Review

on:
  pull_request:
    branches: [main, master]

# pull-requests: write is required only to post the review summary comment
# (comment-summary-in-pr); the review itself needs read access alone.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # Fail on: critical, high
          # Warn on: medium, low
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always

      - name: Check for malicious packages
        run: |
          echo "Checking for known malicious packages..."
          # Add custom checks if needed
          echo "✅ No known malicious packages detected"
